server:
  port: 8080
spring:
  application:
    name: leankeel
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:leankeel@163.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
#default system account  admin/admin123
#default tenant account  leankeel/leankeel123
leankeel:
  session:
    store-type: ${SESSION_STORE_TYPE:memory}
    cache:
      store-type: ${LEANKEEL_CACHE_STORE_TYPE:caffeine}
    tenant:
      max-count: ${LEANKEEL_TENANT_MAX_COUNT:0}
      max-users-per-tenant: ${LEANKEEL_TENANT_MAX_USERS:0}
    security:
      security:
      allowed-hosts: localhost,127.0.0.1,leankeel.com,www.leankeel.com
      cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:,https://leankeel.com,https://www.leankeel.com,http://leankeel.com,http://www.leankeel.com,https://localhost:5173,https://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}
logging:
  level:
    org.leankeel: INFO
  file:
    path: ./logs
    name: ./logs/leankeel.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB